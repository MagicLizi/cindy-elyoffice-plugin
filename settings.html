<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/settings.css">
</head>
<body>
  <main class="page">
    <section class="status" aria-live="polite">
      <div class="status-head">
        <span class="status-icon" id="status-icon" data-kind="busy" aria-hidden="true"></span>
        <div class="status-text">
          <h2 class="title" id="title"></h2>
          <p class="desc" id="desc" hidden></p>
        </div>
      </div>

      <div class="progress" id="progress" hidden>
        <div class="track"><div class="fill" id="fill"></div></div>
        <p class="small muted" id="progress-text"></p>
      </div>

      <ul class="running" id="running" hidden></ul>

      <p class="small muted" id="meta" hidden></p>

      <div class="actions" id="actions" hidden></div>

      <div class="confirm" id="confirm" hidden>
        <p class="small" data-i18n="confirmText"></p>
        <div class="actions">
          <button type="button" class="btn danger-fill" id="confirm-yes" data-i18n="confirmYes"></button>
          <button type="button" class="btn" id="confirm-no" data-i18n="cancel"></button>
        </div>
      </div>

      <p class="small muted note" id="note" hidden></p>
    </section>

    <hr class="divider">

    <section class="prefs">
      <label class="switch-row" for="autosave">
        <span class="switch-text">
          <span class="label" data-i18n="autosaveLabel"></span>
          <span class="small muted" id="autosave-hint"></span>
        </span>
        <input type="checkbox" id="autosave" role="switch" disabled>
      </label>
    </section>

    <footer class="links small">
      <a href="https://github.com/ELY-Open-Source/ElyOffice" data-i18n="homeLink"></a>
      <button type="button" class="link danger" id="uninstall" data-i18n="uninstallLink" hidden></button>
    </footer>
  </main>
  <script src="/settings.js"></script>
</body>
</html>
