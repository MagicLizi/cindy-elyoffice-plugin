<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/settings.css">
</head>
<body>
  <main class="rows">
    <!-- ElyOffice 应用本身：状态、版本、安装 / 更新 -->
    <section class="row" id="app-row" aria-live="polite">
      <div class="row-main">
        <h3 class="row-title" data-i18n="appTitle"></h3>
        <p class="row-meta">
          <span class="status"><span class="dot" id="app-dot"></span><span id="app-status"></span></span>
          <span id="app-version" hidden></span>
          <span id="app-latest" hidden></span>
          <a id="app-link" href="https://github.com/ELY-Open-Source/ElyOffice" data-i18n="homeLink"></a>
        </p>
        <p class="row-desc" id="app-desc" hidden></p>
      </div>
      <div class="row-actions" id="app-actions"></div>
      <div class="row-extra" id="app-extra" hidden>
        <div class="meter" id="meter" hidden><div class="meter-fill" id="meter-fill"></div></div>
        <p class="row-note" id="meter-text" hidden></p>
        <div class="notice" id="notice" hidden>
          <p id="notice-text"></p>
          <ul id="notice-list" hidden></ul>
        </div>
        <p class="row-note" id="app-note" hidden></p>
        <!-- 自动下载失败时的手动下载入口 -->
        <p class="row-note" id="manual" hidden><span id="manual-lead"></span><a id="manual-link" href="https://github.com/ELY-Open-Source/ElyOffice/releases/latest"></a><span id="manual-tail"></span></p>
      </div>
    </section>

    <!-- AI 改完自动保存 -->
    <section class="row" id="autosave-row" hidden>
      <label class="row-main" for="autosave">
        <span class="row-title" data-i18n="autosaveTitle"></span>
        <span class="row-desc" id="autosave-desc"></span>
      </label>
      <input type="checkbox" id="autosave" class="switch" role="switch">
    </section>

    <!-- 卸载 -->
    <section class="row" id="uninstall-row" hidden>
      <div class="row-main">
        <h3 class="row-title" data-i18n="uninstallTitle"></h3>
        <p class="row-desc" id="uninstall-desc"></p>
      </div>
      <div class="row-actions" id="uninstall-actions"></div>
    </section>
  </main>
  <script src="/settings.js"></script>
</body>
</html>
